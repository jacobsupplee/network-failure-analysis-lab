name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Linux tests and app smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: dependencies.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dependencies.txt pytest-cov

      - name: Run tests with coverage
        run: |
          python -m pytest --cov=src --cov=application --cov-report=term-missing --cov-report=xml

      - name: Smoke test Streamlit application
        run: |
          streamlit run application.py --server.headless true --server.port 8501 --browser.gatherUsageStats false > streamlit.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              echo "Streamlit health endpoint responded successfully."
              exit 0
            fi

            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "Streamlit exited before becoming healthy."
              cat streamlit.log
              exit 1
            fi

            sleep 1
          done

          echo "Streamlit did not become healthy within 30 seconds."
          cat streamlit.log
          exit 1

  windows-tests:
    name: Windows compatibility tests
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: dependencies.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dependencies.txt pytest-cov

      - name: Run tests with coverage
        run: |
          python -m pytest --cov=src --cov=application --cov-report=term-missing
